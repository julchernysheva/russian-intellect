<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="application-name" content="Российский интеллект">
<meta name="version" content="V17 FINAL">
<meta name="freeze-date" content="2026-08-16">
<title>Российский интеллект — V17 FINAL — Clean Standalone</title>
<style>
:root{
 --paper:#EFEFEA;--paper2:#E9E9E4;--ink:#4C423D;--warm:#6B5E57;
 --line:rgba(107,94,87,.24);--line2:rgba(107,94,87,.12);
 --blue:#064CFF;--orange:#EF5332;--white:#FFFFFF;--black:#4C423D;
 --sans:"IBM Plex Sans",Arial,sans-serif;--mono:"IBM Plex Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--sans)}
#app{height:100vh;display:grid;grid-template-rows:auto 1fr 26px;min-width:980px}
.top{border-bottom:1px solid var(--line);background:var(--paper);z-index:10}
.primary{height:48px;display:flex;align-items:center;padding:0 28px;gap:28px}
.brand{font:600 11px/1 var(--mono);letter-spacing:.07em;color:var(--ink);white-space:nowrap}
.nav{display:flex;gap:22px;align-items:center}
.nav button,.subnav button,.thirdnav button{appearance:none;border:0;border-bottom:1px solid transparent;background:none;color:var(--warm);cursor:pointer}
.nav button{padding:5px 0;font:600 10px/1 var(--mono);letter-spacing:.08em}
.nav button.active,.subnav button.active,.thirdnav button.active{color:var(--blue);border-color:var(--blue)}
.runtime-badge{margin-left:auto;font:600 9px/1 var(--mono);letter-spacing:.06em;color:var(--warm)}
.runtime-badge.pass{color:var(--warm)} .runtime-badge.fail{color:var(--orange)}
.subnav-wrap{display:none;border-top:1px solid var(--line2);padding:6px 28px 5px;min-height:28px}
.subnav-wrap.open{display:block}
.subnav{display:flex;align-items:center;gap:8px 15px;flex-wrap:wrap}
.subnav button{padding:2px 0;font:600 8.5px/1.2 var(--mono);letter-spacing:.055em}
.thirdnav-wrap{display:none;border-top:1px solid var(--line2);padding:5px 28px 6px;min-height:27px}
.thirdnav-wrap.open{display:block}
.thirdnav{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap}
.thirdnav button{padding:2px 0;font:500 8px/1.2 var(--mono);letter-spacing:.04em}
.stage{position:relative;min-height:0;overflow:hidden}
svg{width:100%;height:100%;display:block}
.grid{stroke:rgba(107,94,87,.045);stroke-width:.65;vector-effect:non-scaling-stroke}
.hist-edge{fill:none;stroke:var(--warm);stroke-opacity:.20;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round;transition:.15s opacity,.15s stroke-opacity,.15s stroke-width}
.hist-edge.INFLUENCE{stroke-dasharray:5 5;stroke-width:1}
.hist-edge.TEACHING{stroke-width:1.15}
.hist-edge.SCHOOL_CONTINUITY{stroke-width:1.0}
.hist-edge.COLLABORATION{stroke-width:.85;stroke-opacity:.16}
.hist-edge.route-active{stroke:var(--orange);stroke-opacity:.96;stroke-width:1.85}
.hist-edge.dim{opacity:.08}
.hist-node{cursor:pointer;transition:.15s opacity}
.hist-node .dot{fill:var(--paper);stroke:var(--black);stroke-width:1.15;vector-effect:non-scaling-stroke}
.hist-node.major .dot{fill:var(--black)}
.hist-node.modern-person .dot{stroke:var(--warm);stroke-width:1.35}
.label-plate{fill:var(--paper);stroke:var(--line);stroke-width:.75;vector-effect:non-scaling-stroke}
.hist-node .surname{font:500 11.7px var(--sans);fill:var(--ink);letter-spacing:.004em}
.hist-node.major .surname{font-size:15.2px;font-weight:500}
.hist-node .years{font:400 7.4px var(--mono);fill:var(--warm);letter-spacing:.025em}
.hist-node.selected .dot{fill:var(--blue);stroke:var(--blue)}
.hist-node.selected .label-plate{fill:var(--blue);stroke:var(--blue)}
.hist-node.selected .surname,.hist-node.selected .years{fill:var(--white)}
.hist-node.dim{opacity:.10}
.hist-node.context{opacity:.48}
.modern-edge{fill:none;stroke:var(--orange);stroke-width:1.18;stroke-opacity:.34;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round;transition:.15s opacity,.15s stroke-width,.15s stroke-opacity}
.modern-edge.strength-B{stroke-dasharray:7 5;stroke-opacity:.25}
.modern-edge.dim{opacity:.06}
.modern-edge.active{stroke-width:2.15;stroke-opacity:1}
.modern-node{cursor:pointer;transition:.15s opacity}
.modern-node .dot{fill:var(--paper);stroke:var(--orange);stroke-width:1.55;vector-effect:non-scaling-stroke}
.modern-node.external .dot{stroke:var(--warm);stroke-width:1.3}
.modern-node.company .dot{fill:var(--orange);stroke:var(--orange)}
.modern-node .mplate{fill:var(--paper);stroke:var(--line);stroke-width:.75;vector-effect:non-scaling-stroke}
.modern-node .mname{font:500 10.8px var(--sans);fill:var(--ink)}
.modern-node .mtype{font:600 6.3px var(--mono);fill:var(--orange);letter-spacing:.06em}
.modern-node.external .mname{font-size:9px;font-weight:500;fill:var(--warm)}
.modern-node.external .mtype{fill:var(--warm)}
.modern-node.company .mname{font-size:12.8px;font-weight:600}
.modern-node.company .mtype{fill:var(--warm)}
.modern-node.selected .dot{fill:var(--blue);stroke:var(--blue)}
.modern-node.selected .mplate{fill:var(--blue);stroke:var(--blue)}
.modern-node.selected .mname,.modern-node.selected .mtype{fill:var(--white)}
.modern-node.dim{opacity:.10}
.modern-node.context{opacity:.48}
.modern-node:hover .mplate{stroke:#fff;stroke-width:1.8}
.drawer{
 position:absolute;left:50%;top:50%;transform:translate(-28%,-50%);
 width:430px;max-height:76%;overflow:auto;
 background:rgba(239,239,234,.985);
 border:1px solid var(--line);border-top:3px solid var(--orange);
 padding:23px 22px 25px;display:none;z-index:20;
 box-shadow:0 10px 30px rgba(76,66,61,.08)
}
.drawer.open{display:block}
.drawer.pos-left{left:37%;transform:translate(-50%,-50%)}
.drawer.pos-right{left:62%;transform:translate(-50%,-50%)}
.drawer.company-safe{
 left:18px;top:18px;bottom:18px;transform:none;
 width:398px;max-height:none;height:auto;overflow:auto
}
#map{transition:width .18s ease,margin-left .18s ease}
.stage.company-card-open #map{
 width:calc(100% - 432px);margin-left:432px
}

.drawer button.close{position:absolute;right:14px;top:12px;border:0;background:none;font:400 22px/1 var(--sans);color:var(--warm);cursor:pointer}
.drawer .selected-badge{display:inline-block;background:var(--blue);color:var(--white);padding:5px 8px;margin:0 0 10px;font:600 7px/1 var(--mono);letter-spacing:.06em}
.drawer .eyebrow{font:600 8px/1.2 var(--mono);letter-spacing:.08em;color:var(--orange);margin:0 34px 8px 0;text-transform:uppercase}
.drawer h2{margin:0 34px 6px 0;font-size:25px;font-weight:500;line-height:1.06;letter-spacing:-.012em}
.drawer .meta{font:400 9px/1.4 var(--mono);color:var(--warm);margin-bottom:18px;letter-spacing:.02em}
.drawer .section{border-top:1px solid var(--line2);padding-top:10px;margin-top:12px}
.drawer .key{font:600 7px/1.2 var(--mono);letter-spacing:.07em;color:var(--warm);margin-bottom:6px;text-transform:uppercase}
.drawer .value{font-size:12.5px;line-height:1.45}
.drawer .lead{font-size:14px;line-height:1.48}
.drawer .tags{display:flex;gap:5px;flex-wrap:wrap}
.drawer .tag{border:1px solid var(--line);padding:3px 6px;font:500 7px/1.1 var(--mono);letter-spacing:.03em}
.drawer .relation{display:grid;grid-template-columns:1fr auto;gap:8px;padding:6px 0;border-top:1px solid var(--line2);font-size:11.5px;line-height:1.3}
.drawer .relation-type{font:500 7px/1.2 var(--mono);letter-spacing:.04em;color:var(--warm);text-align:right}
.drawer .route{padding:7px 0;border-top:1px solid var(--line2);font:500 9.5px/1.42 var(--mono)}
.drawer .evidence{display:inline-block;border:1px solid var(--orange);padding:3px 6px;margin-right:5px;font:600 7px/1 var(--mono);letter-spacing:.055em;color:var(--orange)}
.drawer .source{display:block;padding:5px 0;border-top:1px solid var(--line2);font:500 8px/1.35 var(--mono);color:var(--warm);text-decoration:none}
.drawer .source:hover{color:var(--blue)}
.drawer .empty{color:var(--warm)}
.footer{border-top:1px solid var(--line2);display:flex;align-items:center;padding:0 18px;gap:14px;font:500 7px/1 var(--mono);letter-spacing:.045em;color:rgba(107,94,87,.72)}
.footer strong{color:var(--ink);font-weight:600}
.footer .spacer{margin-left:auto}
.error{position:absolute;inset:18px;background:var(--paper);border:1px solid var(--orange);padding:20px;z-index:50;font:12px/1.5 var(--mono);display:none;white-space:pre-wrap}
.error.open{display:block}

/* V17.6 — VISUAL HIERARCHY / LABELS */
.hist-node.tier-primary .dot{fill:var(--ink);stroke:var(--ink);stroke-width:1.35}
.hist-node.tier-primary .surname{font-size:18.2px;font-weight:600;letter-spacing:.015em}
.hist-node.tier-primary .years{font-size:9.4px}
.hist-node.tier-connected{opacity:.92}
.hist-node.tier-connected .dot{stroke-width:1.25}
.hist-node.tier-connected .surname{font-size:13px;font-weight:500}
.hist-node.tier-connected .years{font-size:7.8px}
.hist-node.tier-context{opacity:.68}
.hist-node.tier-context .dot{stroke-opacity:.72}
.hist-node.tier-context .surname{font-size:10.2px;font-weight:500}
.hist-node.tier-context .years{font-size:6.8px}
.hist-node.selected{opacity:1}
.hist-node.selected .dot{fill:var(--blue);stroke:var(--blue)}
.hist-node.selected .label-plate{fill:var(--blue);stroke:var(--blue)}
.hist-node.selected .surname,.hist-node.selected .years{fill:var(--white)}

.modern-node.tier-primary.company .dot{fill:var(--orange);stroke:var(--orange);stroke-width:1.7}
.modern-node.tier-primary.company .mname{font-size:18.6px;font-weight:700;letter-spacing:.02em}
.modern-node.tier-primary.company .mtype{font-size:7.2px}
.modern-node.tier-primary.company .mstats{font:600 6.1px/1 var(--mono);letter-spacing:.05em;fill:var(--warm);text-transform:uppercase}
.modern-node.tier-context{opacity:.72}
.modern-node.tier-context.technology .dot{fill:var(--paper);stroke:var(--orange);stroke-width:1.25}
.modern-node.tier-context.technology .mplate{stroke:rgba(239,83,50,.38)}
.modern-node.tier-context.technology .mname{font-size:10px;font-weight:500}
.modern-node.tier-context.technology .mtype{font-size:5.8px}
.modern-node.tier-context.external .dot{fill:var(--paper);stroke:var(--warm);stroke-width:1.1}
.modern-node.tier-context.external .mname{font-size:8.8px;font-weight:500}
.modern-node.tier-context.external .mtype{font-size:5.4px}
.modern-node.tier-context.middle-context .dot{fill:var(--paper);stroke:var(--warm);stroke-width:1.05}
.modern-node.tier-context.middle-context .mname{font-size:9px;font-weight:500}
.modern-node.tier-context.middle-context .mtype{font-size:5.4px}
.modern-node.selected{opacity:1}
.modern-node.selected .dot{fill:var(--blue);stroke:var(--blue)}
.modern-node.selected .mplate{fill:var(--blue);stroke:var(--blue)}
.modern-node.selected .mname,.modern-node.selected .mtype{fill:var(--white)}

.edge-label-group{pointer-events:none;opacity:0;transition:opacity .14s ease}
.edge-label-group.prominent{opacity:.36}
.edge-label-group.endpoint-label{opacity:.28}
.edge-label-group.hovered{opacity:.88}
.edge-label-group.active{opacity:1}
.edge-label-group.dim{opacity:.035}
.edge-label-bg{fill:rgba(239,239,234,.94);stroke:var(--line2);stroke-width:.55;vector-effect:non-scaling-stroke}
.edge-label-text{font:600 5.5px/1 var(--mono);letter-spacing:.055em;fill:var(--warm);text-transform:uppercase}
.edge-label-group.active .edge-label-bg{stroke:rgba(239,83,50,.34)}
.edge-label-group.active .edge-label-text{fill:var(--orange)}
.hist-edge,.modern-edge{pointer-events:stroke;cursor:default}


/* V17.6.4 — EDGE GEOMETRY NORMALIZATION */

/* COMPANY PRIMARY > MODERN PRIMARY > HISTORICAL PRIMARY > CONNECTED > CONTEXT */
.hist-node.tier-primary .surname{font-size:15.8px;font-weight:600;letter-spacing:.008em}
.hist-node.tier-primary .years{font-size:8.7px}

.hist-node.tier-modern-primary{opacity:1}
.hist-node.tier-modern-primary .dot{fill:var(--orange);stroke:var(--orange);stroke-width:1.6}
.hist-node.tier-modern-primary .label-plate{fill:var(--paper);stroke:var(--orange);stroke-width:.9}
.hist-node.tier-modern-primary .surname{font-size:17.2px;font-weight:650;letter-spacing:.012em;fill:var(--ink)}
.hist-node.tier-modern-primary .years{font-size:8.8px;fill:var(--warm)}

.modern-node.tier-primary.company .dot{fill:var(--orange);stroke:var(--orange);stroke-width:1.8}
.modern-node.tier-primary.company .mplate{fill:var(--orange);stroke:var(--orange);stroke-width:.9}
.modern-node.tier-primary.company .mname{font-size:20.4px;font-weight:700;letter-spacing:.022em;fill:var(--white)}
.modern-node.tier-primary.company .mtype{font-size:7.6px;fill:var(--white)}
.modern-node.tier-primary.company .mstats{
 font:600 6.5px/1 var(--mono);
 letter-spacing:.05em;
 fill:rgba(255,255,255,.82);
 text-transform:uppercase
}

/* Selected state overrides orange without changing dimensions. */
.hist-node.tier-modern-primary.selected .dot,
.modern-node.tier-primary.company.selected .dot{fill:var(--blue);stroke:var(--blue)}
.hist-node.tier-modern-primary.selected .label-plate,
.modern-node.tier-primary.company.selected .mplate{fill:var(--blue);stroke:var(--blue)}
.hist-node.tier-modern-primary.selected .surname,
.hist-node.tier-modern-primary.selected .years,
.modern-node.tier-primary.company.selected .mname,
.modern-node.tier-primary.company.selected .mtype,
.modern-node.tier-primary.company.selected .mstats{fill:var(--white)}


/* V17.7 — CARDS + SEARCH */
.entity-search{position:relative;margin-left:auto;width:min(360px,28vw);z-index:40}
.search-field{height:34px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line);color:var(--warm)}
.search-icon{font:500 17px/1 var(--sans);transform:translateY(-1px)}
.search-field input{appearance:none;border:0;outline:0;background:transparent;width:100%;padding:7px 0;color:var(--ink);font:500 10px/1.2 var(--mono);letter-spacing:.055em}
.search-field input::placeholder{color:var(--warm)}
.search-field:focus-within{border-color:var(--blue)}
.entity-search-results{position:absolute;top:38px;right:0;width:min(390px,42vw);max-height:480px;overflow:auto;background:rgba(239,239,234,.995);border-top:2px solid var(--blue);border-bottom:1px solid var(--line);box-shadow:0 12px 32px rgba(76,66,61,.09)}
.entity-search-results[hidden]{display:none}
.search-result{display:block;width:100%;border:0;border-bottom:1px solid var(--line2);background:transparent;padding:12px 12px 11px;text-align:left;color:var(--ink);cursor:pointer}
.search-result:hover,.search-result.active{background:var(--paper2)}
.search-result-title{display:block;font:500 14px/1.18 var(--sans)}
.search-result-meta{display:block;margin-top:3px;color:var(--warm);font:500 7px/1.35 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.search-result-route{display:block;margin-top:4px;color:var(--orange);font:600 6.5px/1.25 var(--mono);letter-spacing:.06em}
.search-empty{padding:14px;color:var(--warm);font:500 8px/1.3 var(--mono);letter-spacing:.06em}

.drawer{width:440px;max-width:calc(100% - 36px);height:auto;min-height:280px;max-height:min(640px,calc(100% - 36px));padding:0;overflow:hidden;display:none}
.drawer.open{display:flex;flex-direction:column}
.drawer.company-safe{width:410px;top:18px;bottom:auto;max-height:min(640px,calc(100% - 36px));height:auto;overflow:hidden}
.drawer button.close{z-index:3;right:15px;top:14px}
.card-shell{display:flex;flex-direction:column;min-height:0;max-height:inherit;height:100%}
.card-head{flex:0 0 auto;padding:24px 22px 15px;border-bottom:1px solid var(--line2)}
.card-head .selected-badge{margin-bottom:10px}
.card-head h2{font-size:25px;margin-bottom:7px}
.card-head .eyebrow{margin-bottom:8px}
.card-head .meta{margin:0;font-size:8px}
.card-tabs{display:flex;flex:0 0 auto;gap:16px;padding:11px 22px 10px;border-bottom:1px solid var(--line2);overflow-x:auto}
.card-tab{appearance:none;border:0;border-bottom:1px solid transparent;background:none;padding:3px 0;color:var(--warm);font:600 7px/1 var(--mono);letter-spacing:.055em;white-space:nowrap;cursor:pointer}
.card-tab.active{color:var(--blue);border-color:var(--blue)}
.card-tab .count{color:var(--orange);margin-left:3px}
.card-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;padding:17px 22px 22px;scrollbar-width:thin}
.card-block{padding:0 0 15px;margin:0 0 15px;border-bottom:1px solid var(--line2)}
.card-block:last-child{border-bottom:0;margin-bottom:0}
.card-key{margin-bottom:7px;color:var(--warm);font:600 7px/1.2 var(--mono);letter-spacing:.075em;text-transform:uppercase}
.card-copy{font:400 14px/1.48 var(--sans);color:var(--ink)}
.card-copy.lead{font-size:15px}
.card-tags{display:flex;flex-wrap:wrap;gap:5px}
.card-tag{border:1px solid var(--line);padding:4px 6px;font:500 6.5px/1 var(--mono);letter-spacing:.03em}
.relation{display:grid;grid-template-columns:1fr auto;gap:12px;padding:9px 0;border-top:1px solid var(--line2);font-size:12px;line-height:1.3}
.relation:first-child{border-top:0}
.entity-link{appearance:none;border:0;background:none;padding:0;text-align:left;color:var(--ink);font:500 12px/1.3 var(--sans);cursor:pointer}
.entity-link:hover{color:var(--blue)}
.relation-type{color:var(--warm);font:600 6.5px/1.25 var(--mono);letter-spacing:.045em;text-align:right}
.route-card{padding:12px 0;border-top:1px solid var(--line2)}
.route-card:first-child{border-top:0;padding-top:0}
.route-top{display:flex;gap:7px;align-items:center;margin-bottom:7px}
.route-id{color:var(--orange);font:600 7px/1 var(--mono);letter-spacing:.06em}
.route-badge{border:1px solid var(--orange);padding:3px 5px;color:var(--orange);font:600 6px/1 var(--mono)}
.route-channel{color:var(--warm);font:500 6px/1.2 var(--mono);letter-spacing:.04em}
.route-path{font:500 11px/1.45 var(--sans);margin-bottom:6px}
.route-claim{font:400 11px/1.45 var(--sans);color:var(--warm)}
.route-focus{appearance:none;border:0;border-bottom:1px solid transparent;background:none;margin-top:7px;padding:2px 0;color:var(--blue);font:600 6.5px/1 var(--mono);letter-spacing:.06em;cursor:pointer}
.route-focus.active{border-color:var(--blue)}
.source-card{padding:10px 0;border-top:1px solid var(--line2)}
.source-card:first-child{border-top:0;padding-top:0}
.source-title{font:500 11px/1.4 var(--sans)}
.source-link{display:inline-block;margin-top:5px;color:var(--blue);font:600 6.5px/1.2 var(--mono);letter-spacing:.055em;text-decoration:none}
.source-status{display:inline-block;margin-left:8px;color:var(--orange);font:600 6px/1 var(--mono)}
.card-empty{color:var(--warm);font:400 12px/1.45 var(--sans)}
@media(max-width:1100px){.entity-search{width:250px}.drawer{width:400px}.drawer.company-safe{width:380px}.stage.company-card-open #map{width:calc(100% - 402px);margin-left:402px}}

</style>
</head>
<body>
<main id="app">
<header class="top">
 <div class="primary">
  <div class="brand">РОССИЙСКИЙ ИНТЕЛЛЕКТ</div>
  <nav class="nav">
   <button class="active" data-mode="MAP">КАРТА</button>
   <button data-mode="PEOPLE">ЛЮДИ</button>
   <button data-mode="TECH">ТЕХНОЛОГИИ</button>
   <button data-mode="COMPANY">КОМПАНИИ</button>
  </nav>
  <div id="entitySearch" class="entity-search"><label class="search-field"><span class="search-icon">⌕</span><input id="entitySearchInput" type="search" autocomplete="off" spellcheck="false" placeholder="ПОИСК" aria-label="Поиск людей, технологий и компаний" aria-expanded="false"></label><div id="entitySearchResults" class="entity-search-results" role="listbox" hidden></div></div><div id="runtimeBadge" class="runtime-badge">DATA · LOADING</div>
 </div>
 <div id="subnavWrap" class="subnav-wrap"><nav id="subnav" class="subnav"></nav></div>
 <div id="thirdnavWrap" class="thirdnav-wrap"><nav id="thirdnav" class="thirdnav"></nav></div>
</header>
<section class="stage" id="stage">
 <svg id="map" viewBox="0 -18 1860 980" preserveAspectRatio="xMidYMid meet" aria-label="Генеалогия людей, технологий и компаний">
  <g id="grid"></g><g id="historicalEdges"></g><g id="historicalLabels"></g><g id="modernEdges"></g><g id="modernLabels"></g><g id="historicalNodes"></g><g id="modernNodes"></g>
 </svg>
 <aside id="drawer" class="drawer"><button class="close">×</button><div id="drawerBody"></div></aside>
 <div id="error" class="error"></div>
</section>
<footer class="footer">
 <span><strong>V17 FINAL</strong> CLEAN STANDALONE · FROZEN</span>
 <span id="counts">—</span>
 <span id="viewState" class="spacer">КАРТА · ВСЁ</span>

function scanBalancedArray(text,start){let i=start,d=0,q=null,e=false;for(;i<text.length;i++){const ch=text[i];if(q){if(e)e=false;else if(ch==='\\')e=true;else if(ch===q)q=null;continue}if(ch==='"'||ch==="'"){q=ch;continue}if(ch==='[')d++;else if(ch===']'){d--;if(d===0)return text.slice(start,i+1)}}throw new Error('Unclosed array')}
function extractConstArray(text,name){const m=text.indexOf('const '+name+'=');if(m<0)throw new Error('Missing '+name);const a=text.indexOf('[',m);return JSON.parse(scanBalancedArray(text,a))}
function extractPushArrays(text,name){let pos=0,out=[];const mark=name+'.push(...';while(true){const m=text.indexOf(mark,pos);if(m<0)break;const a=text.indexOf('[',m);out.push(...JSON.parse(scanBalancedArray(text,a)));pos=a+1}return out}

function routeIdsFor(rt,id){return [...new Set(rt.routesByEntity[id]||[])]}
function routeText(rt,rid){const parts=[];(rt.segmentsByRoute[rid]||[]).forEach(s=>{const a=modernDisplayName(rt.entityById[s.source_entity_id]),b=modernDisplayName(rt.entityById[s.target_entity_id]);if(!parts.length)parts.push(a);else if(parts.at(-1)!==a)parts.push(a);parts.push(b)});return parts.join(' → ')}
function routeSources(rt,rids){const out=[];rids.forEach(rid=>{const r=rt.routeMeta[rid];if(!r)return;splitUrls(r.source_primary).forEach(url=>out.push({title:`${rid} · основной источник`,url,status:r.evidence_state||r.strength||''}));splitUrls(r.source_secondary).forEach(url=>out.push({title:`${rid} · дополнительный источник`,url,status:r.evidence_state||r.strength||''}))});const seen=new Set();return out.filter(x=>!seen.has(x.url)&&seen.add(x.url))}
function historicalSources(rt,id){const out=[];rt.historical.edges.filter(e=>e.source_id===id||e.target_id===id).forEach(e=>{if(e.source_url)out.push({title:e.source_title||`${e.edge_id} · ${relationRu(e.flow_type)}`,url:e.source_url,status:e.evidence_level||''})});const seen=new Set();return out.filter(x=>!seen.has(x.url)&&seen.add(x.url))}
function personSources(rt,id){const c=rt.cardById[id]||{};const own=(c.person_sources||[]).map(x=>({...x,status:c.fact_check_status||''}));return [...own,...historicalSources(rt,id),...routeSources(rt,routeIdsFor(rt,id))].filter((x,i,a)=>x.url&&a.findIndex(y=>y.url===x.url)===i)}

function buildRuntime(hist,cards,tags){
 const entityById={},segmentsByRoute={},routesByCompany={},routesByTechnology={},routesByEntity={},routeMeta={},routeNodeSets={};
 hist.people.forEach(p=>entityById[p.person_id]={...p,entity_type:'BASE_PERSON'});
 P0.external_entities.forEach(e=>entityById[e.entity_id]={...e});
 P0.technologies.forEach(e=>entityById[e.entity_id]={...e,entity_type:'TECHNOLOGY'});
 P0.middle_entities.forEach(e=>entityById[e.entity_id]={...e});
 P0.companies.forEach(e=>entityById[e.entity_id]={...e,entity_type:'COMPANY'});
 P0.modern_routes.forEach(r=>routeMeta[r.route_id]=r);
 P0.route_segments.forEach(s=>{
  (segmentsByRoute[s.route_id]??=[]).push(s);
  (routesByEntity[s.source_entity_id]??=[]).push(s.route_id);
  (routesByEntity[s.target_entity_id]??=[]).push(s.route_id);
  (routeNodeSets[s.route_id]??=new Set()).add(s.source_entity_id);
  routeNodeSets[s.route_id].add(s.target_entity_id);
 });
 Object.values(segmentsByRoute).forEach(a=>a.sort((x,y)=>x.sequence-y.sequence));
 P0.modern_routes.forEach(r=>{
  (routesByCompany[r.company_entity_id]??=[]).push(r.route_id);
  if(r.middle_entity_id?.startsWith('T'))(routesByTechnology[r.middle_entity_id]??=[]).push(r.route_id);
 });
 const routeNodeCount=Object.fromEntries(Object.entries(routeNodeSets).map(([rid,set])=>[rid,set.size]));
 const baseEdgeWaveContext={};
 P0.route_segments.forEach(s=>{
  if(s.relation_type!=='BASE_EDGE_REF'||!s.base_edge_id)return;
  const previous=baseEdgeWaveContext[s.base_edge_id];
  if(!previous||s.sequence<previous.sequence){
   baseEdgeWaveContext[s.base_edge_id]={
    route_id:s.route_id,
    sequence:s.sequence,
    node_count:routeNodeCount[s.route_id]||2
   };
  }
 });
 const cardById=Object.fromEntries(cards.map(c=>[c.person_id,c]));
 const tagById=Object.fromEntries(tags.map(t=>[t.person_id,t]));
 return{
  historical:hist,entityById,segmentsByRoute,routesByCompany,routesByTechnology,
  routesByEntity,routeMeta,routeNodeCount,baseEdgeWaveContext,cardById,tagById
 };
}

function pos(id){return LAYOUT[id]||MODERN_POS[id]}
function curveSign(key){
 let hash=0;
 for(let index=0;index<String(key).length;index++){
  hash=((hash*31)+String(key).charCodeAt(index))|0;
 }
 return (hash&1)?1:-1;
}
function cubicPath(start,control1,control2,end){
 return `M${start[0]},${start[1]} C${control1[0]},${control1[1]} ${control2[0]},${control2[1]} ${end[0]},${end[1]}`;
}
function horizontalFlowBezier(
 start,
 end,
 {minHandle=28,maxHandle=320,ratio=.42,verticalLoop=56}={}
){
 const dx=end[0]-start[0],dy=end[1]-start[1];

 // Same-column route segments use an S-loop. Their entry and exit
 // tangents still point right, matching adjacent left-to-right segments.
 if(Math.abs(dx)<1){
  const loop=Math.max(
   30,
   Math.min(90,Math.abs(dy)*.42||verticalLoop)
  );
  const control1=[start[0]+loop,start[1]];
  const control2=[end[0]-loop,end[1]];
  return cubicPath(start,control1,control2,end);
 }

 const direction=Math.sign(dx)||1;
 const handle=Math.max(
  minHandle,
  Math.min(maxHandle,Math.abs(dx)*ratio)
 );
 const control1=[
  start[0]+direction*handle,
  start[1]
 ];
 const control2=[
  end[0]-direction*handle,
  end[1]
 ];
 return cubicPath(start,control1,control2,end);
}
function softHistoricalBezier(
 start,
 end,
 key,
 scale=.055,
 minOffset=10,
 maxOffset=38
){
 const dx=end[0]-start[0],dy=end[1]-start[1];
 const length=Math.hypot(dx,dy)||1;

 // Most historical relations receive the same rounded horizontal-entry
 // language without being converted into modern route paths.
 if(Math.abs(dx)>=44){
  return horizontalFlowBezier(
   start,
   end,
   {minHandle:24,maxHandle:180,ratio:.34,verticalLoop:44}
  );
 }

 // Very short / nearly vertical historical relations retain a compact bow.
 const normalX=-dy/length,normalY=dx/length;
 const amplitude=curveSign(key)*Math.max(
  minOffset,
  Math.min(maxOffset,length*scale)
 );
 const control1=[
  start[0]+dx*.32+normalX*amplitude,
  start[1]+dy*.32+normalY*amplitude
 ];
 const control2=[
  start[0]+dx*.70+normalX*amplitude,
  start[1]+dy*.70+normalY*amplitude
 ];
 return cubicPath(start,control1,control2,end);
}
function normalizedRouteBezier(start,end,routeId,sequence=1){
 return horizontalFlowBezier(
  start,
  end,
  {minHandle:30,maxHandle:320,ratio:.42,verticalLoop:58}
 );
}
function routeBezier(start,end,routeId,sequence,nodeCount){
 return normalizedRouteBezier(start,end,routeId,sequence);
}
function histCurve(runtime,edge){
 const start=LAYOUT[edge.source_id],end=LAYOUT[edge.target_id];
 if(!start||!end)return'';

 // BASE_EDGE_REF is a visible part of a modern route and therefore
 // receives exactly the same endpoint-tangent contract.
 const routeContext=runtime.baseEdgeWaveContext[edge.edge_id];
 if(routeContext&&routeContext.node_count>=3){
  return normalizedRouteBezier(
   start,
   end,
   routeContext.route_id,
   routeContext.sequence
  );
 }

 return softHistoricalBezier(start,end,edge.edge_id,.055,10,38);
}

function attachEdgeLabel(path,text,targetGroup,classNames='',dataset={}){
 const group=document.createElementNS(NS,'g');
 group.setAttribute('class',`edge-label-group ${classNames}`.trim());
 Object.entries(dataset).forEach(([key,value])=>group.dataset[key]=value);
 const rect=document.createElementNS(NS,'rect');
 rect.setAttribute('class','edge-label-bg');
 rect.setAttribute('rx','1.5');rect.setAttribute('ry','1.5');
 const label=document.createElementNS(NS,'text');
 label.setAttribute('class','edge-label-text');
 label.setAttribute('text-anchor','middle');
 label.setAttribute('dominant-baseline','middle');
 label.textContent=text;
 group.append(rect,label);group._edgePath=path;targetGroup.append(group);
 requestAnimationFrame(()=>{
  try{
   const point=path.getPointAtLength(path.getTotalLength()*.5);
   group.setAttribute('transform',`translate(${point.x} ${point.y})`);
   const box=label.getBBox();
   rect.setAttribute('x',box.x-3);rect.setAttribute('y',box.y-2);
   rect.setAttribute('width',box.width+6);rect.setAttribute('height',box.height+4);
  }catch(_e){}
 });
 path.addEventListener('mouseenter',()=>group.classList.add('hovered'));
 path.addEventListener('mouseleave',()=>group.classList.remove('hovered'));
 return group;
}


function screenBoxesOverlap(a,b,padding=2){
 return !(
  a.right+padding<=b.left||b.right+padding<=a.left||
  a.bottom+padding<=b.top||b.bottom+padding<=a.top
 );
}
function placeLabelAtFraction(group,fraction){
 const path=group._edgePath;if(!path)return;
 const point=path.getPointAtLength(path.getTotalLength()*fraction);
 group.dataset.fraction=String(fraction);
 group.setAttribute('transform',`translate(${point.x} ${point.y})`);
}
function resolveVisibleEdgeLabelCollisions(){
 const nodeBoxes=[...document.querySelectorAll('.hist-node,.modern-node')]
  .map(node=>node.getBoundingClientRect());
 const visible=[...document.querySelectorAll('.edge-label-group')]
  .filter(group=>{
   const opacity=Number(getComputedStyle(group).opacity||0);
   return group.classList.contains('active')||
    group.classList.contains('prominent')||
    group.classList.contains('endpoint-label')||
    opacity>.08;
  });
 const placed=[];
 const candidates=[.50,.42,.58,.34,.66,.27,.73,.20,.80];
 visible.forEach(group=>{
  let best={fraction:.5,score:Infinity};
  for(const fraction of candidates){
   placeLabelAtFraction(group,fraction);
   const box=group.getBoundingClientRect();
   let score=0;
   nodeBoxes.forEach(nodeBox=>{if(screenBoxesOverlap(box,nodeBox,2))score+=10});
   placed.forEach(labelBox=>{if(screenBoxesOverlap(box,labelBox,2))score+=4});
   if(score<best.score){best={fraction,score};if(score===0)break}
  }
  placeLabelAtFraction(group,best.fraction);
  placed.push(group.getBoundingClientRect());
 });
}

   `hist-node tier-${tier} ${MODERN_PRIMARY_PEOPLE.has(person.person_id)?'modern-primary-anchor ':''}${['P019','P020','P021','P022','P023'].includes(person.person_id)?'modern-person':''}`.trim()
  );
  group.setAttribute('transform',`translate(${xy[0]} ${xy[1]})`);
  group.dataset.id=person.person_id;group.dataset.tier=tier;

  const radius=
   tier==='modern-primary'?7.2:
   tier==='primary'?6.3:
   tier==='connected'?4.7:
   3.2;
  const padX=
   tier==='modern-primary'?5:
   tier==='primary'?5:
   tier==='connected'?4:
   3;
  const clearance=
   tier==='modern-primary'?5.8:
   tier==='primary'?4.7:
   tier==='connected'?4.3:
   3.8;
  const textX=radius+padX+clearance;

  const dot=document.createElementNS(NS,'circle');
  dot.setAttribute('class','dot');dot.setAttribute('r',radius);
  group.append(dot);

  const labelDy=person.person_id==='P022'?-14:person.person_id==='B022'?12:0;
  const text=document.createElementNS(NS,'text');
  text.setAttribute('x',textX);text.setAttribute('y',String(-3+labelDy));
  const family=document.createElementNS(NS,'tspan');
  family.setAttribute('class','surname');family.textContent=person.surname.toUpperCase();
  text.append(family);
  if(person.birth_year){
   const years=document.createElementNS(NS,'tspan');
   years.setAttribute('class','years');years.setAttribute('x',textX);
   years.setAttribute(
    'dy',
    tier==='modern-primary'?'12':
    tier==='primary'?'11':
    tier==='connected'?'10':
    '9'
   );
   years.textContent=person.birth_year+'–'+(person.death_year||'');
   text.append(years);
  }
  group.append(text);ng.append(group);
  requestAnimationFrame(()=>{
   try{
    const box=text.getBBox(),plate=document.createElementNS(NS,'rect');
    const padY=(tier==='modern-primary'||tier==='primary')?3:2;
    plate.setAttribute('class','label-plate');
    plate.setAttribute('rx','1.5');plate.setAttribute('ry','1.5');
    plate.setAttribute('x',box.x-padX);plate.setAttribute('y',box.y-padY);
    plate.setAttribute('width',box.width+padX*2);plate.setAttribute('height',box.height+padY*2);
    group.dataset.dotRadius=String(radius);
    group.dataset.labelClearance=String(clearance);
    group.insertBefore(plate,text);
   }catch(_e){}
  });
  group.onclick=event=>{event.stopPropagation();selectEntity(rt,person.person_id)};
 });
}


function modernLabelSide(id,type,xy){
 if(type==='PERSON')return'left';
 if(type==='COMPANY')return'right';
 if(type!=='TECHNOLOGY')return'left';
 return'right';
}


function companyRouteSummary(companyId,rt){
 const relatedRoutes=P0.modern_routes.filter(route=>route.company_entity_id===companyId);
 const routeIds=new Set(relatedRoutes.map(route=>route.route_id));
 const people=new Set();
 P0.route_segments.forEach(segment=>{
  if(!routeIds.has(segment.route_id))return;
  const source=rt.entityById[segment.source_entity_id],target=rt.entityById[segment.target_entity_id];
  if(source&&['BASE_PERSON','PERSON'].includes(source.entity_type))people.add(segment.source_entity_id);
  if(target&&['BASE_PERSON','PERSON'].includes(target.entity_type))people.add(segment.target_entity_id);
 });
 const routeWord=relatedRoutes.length===1?'ПУТЬ':'ПУТИ';
 const peopleWord=people.size===1?'ЧЕЛОВЕК':'ЛЮДЕЙ';
 return `${relatedRoutes.length} ${routeWord} · ${people.size} ${peopleWord}`;
}
function addModern(rt){
 const eg=document.getElementById('modernEdges'),lg=document.getElementById('modernLabels'),ng=document.getElementById('modernNodes');
 const companyIds=new Set(P0.companies.map(company=>company.entity_id));
 P0.route_segments.forEach(segment=>{
  if(segment.relation_type==='BASE_EDGE_REF')return;
  const a=pos(segment.source_entity_id),b=pos(segment.target_entity_id);if(!a||!b)return;
  const nodeCount=rt.routeNodeCount[segment.route_id]||2;
  const curveStyle=nodeCount>=3?'wave':'bow';
  const path=document.createElementNS(NS,'path');
  path.setAttribute('d',routeBezier(a,b,segment.route_id,segment.sequence,nodeCount));
  path.setAttribute('class','modern-edge '+(segment.strength==='B'?'strength-B':''));
  path.dataset.curveStyle=curveStyle;path.dataset.route=segment.route_id;
  path.dataset.source=segment.source_entity_id;path.dataset.target=segment.target_entity_id;
  eg.append(path);
  const endpoint=companyIds.has(segment.target_entity_id);
  attachEdgeLabel(
   path,
   modernRelationLabel(segment),
   lg,
   endpoint?'modern-label endpoint-label':'modern-label',
   {route:segment.route_id,source:segment.source_entity_id,target:segment.target_entity_id}
  );
 });
 Object.entries(MODERN_POS).forEach(([id,xy])=>{
  const entity=rt.entityById[id],type=entity.entity_type||'',tier=modernTier(type);
  const typeClass=
   type==='COMPANY'?'company':
   type==='PERSON'?'external':
   type==='TECHNOLOGY'?'technology':'middle-context';
  const group=document.createElementNS(NS,'g');
  group.setAttribute('class',`modern-node tier-${tier} ${typeClass}`);
  group.setAttribute('transform',`translate(${xy[0]} ${xy[1]})`);
  group.dataset.id=id;group.dataset.tier=tier;group.dataset.entityType=type;

  const radius=
   type==='COMPANY'?8.7:
   type==='TECHNOLOGY'?3.5:
   type==='PERSON'?3:
   3.2;
  const platePadX=type==='COMPANY'?6:4;
  const clearance=type==='COMPANY'?6.3:4.2;

  const dot=document.createElementNS(NS,'circle');
  dot.setAttribute('class','dot');dot.setAttribute('r',radius);
  group.append(dot);

  const side=modernLabelSide(id,type,xy);
  const tx=side==='left'
   ?-(radius+platePadX+clearance)
   :(radius+platePadX+clearance);
  const anchor=side==='left'?'end':'start';

  const name=document.createElementNS(NS,'text');
  name.setAttribute('class','mname');
  name.setAttribute('x',tx);
  name.setAttribute('y',type==='COMPANY'?-8:-2);
  name.setAttribute('text-anchor',anchor);
  name.textContent=type==='COMPANY'?modernDisplayName(entity).toUpperCase():modernDisplayName(entity);
  group.append(name);

  const meta=document.createElementNS(NS,'text');
  meta.setAttribute('class','mtype');
  meta.setAttribute('x',tx);
  meta.setAttribute('y',type==='COMPANY'?6:10);
  meta.setAttribute('text-anchor',anchor);
  meta.textContent=modernTypeLabel(entity);
  group.append(meta);

  let stats=null;
  if(type==='COMPANY'){
   stats=document.createElementNS(NS,'text');
   stats.setAttribute('class','mstats');
   stats.setAttribute('x',tx);
   stats.setAttribute('y','18');
   stats.setAttribute('text-anchor',anchor);
   stats.textContent=companyRouteSummary(id,rt);
   group.append(stats);
  }

  ng.append(group);
  requestAnimationFrame(()=>{
   try{
    const boxes=[name.getBBox(),meta.getBBox()];
    if(stats)boxes.push(stats.getBBox());
    const x=Math.min(...boxes.map(box=>box.x))-platePadX;
    const y=Math.min(...boxes.map(box=>box.y))-(type==='COMPANY'?3:2);
    const width=Math.max(...boxes.map(box=>box.x+box.width))-x+platePadX;
    const height=Math.max(...boxes.map(box=>box.y+box.height))-y+(type==='COMPANY'?4:3);
    const plate=document.createElementNS(NS,'rect');
    plate.setAttribute('class','mplate');plate.setAttribute('rx','1.5');plate.setAttribute('ry','1.5');
    plate.setAttribute('x',x);plate.setAttribute('y',y);
    plate.setAttribute('width',width);plate.setAttribute('height',height);
    group.dataset.dotRadius=String(radius);
    group.dataset.labelClearance=String(clearance);
    group.insertBefore(plate,name);
   }catch(_e){}
  });
  group.onclick=event=>{event.stopPropagation();selectEntity(rt,id)};
 });
}

function routeIdsFor(rt,id){return [...new Set(rt.routesByEntity[id]||[])]}
function routeText(rt,rid){
 const segs=rt.segmentsByRoute[rid]||[],parts=[];
 segs.forEach((s,i)=>{const sn=modernDisplayName(rt.entityById[s.source_entity_id]),tn=modernDisplayName(rt.entityById[s.target_entity_id]);if(!parts.length)parts.push(sn);else if(parts[parts.length-1]!==sn)parts.push(sn);parts.push(tn)});
 return parts.join(' → ');
}
function routeClosure(rt,rids){
 const routes=new Set(rids),entities=new Set(),histEdges=new Set();
 rids.forEach(rid=>{(rt.segmentsByRoute[rid]||[]).forEach(s=>{entities.add(s.source_entity_id);entities.add(s.target_entity_id);if(s.base_edge_id)histEdges.add(s.base_edge_id)})});
 return{routes,entities,histEdges};
}
function resetClasses(){
 document.querySelectorAll('.hist-node,.modern-node').forEach(n=>n.classList.remove('selected','dim','context'));
 document.querySelectorAll('.modern-edge').forEach(e=>e.classList.remove('active','dim'));
 document.querySelectorAll('.hist-edge').forEach(e=>e.classList.remove('route-active','dim'));
 document.querySelectorAll('.edge-label-group').forEach(label=>label.classList.remove('active','dim'));
}

function applyRoutes(rt,rids,primaryEntities=new Set()){
 const cl=routeClosure(rt,rids);
 document.querySelectorAll('.modern-edge').forEach(e=>{const on=cl.routes.has(e.dataset.route);e.classList.toggle('active',on);e.classList.toggle('dim',!on)});
 document.querySelectorAll('.modern-label').forEach(label=>{const on=cl.routes.has(label.dataset.route);label.classList.toggle('active',on);label.classList.toggle('dim',!on&&rids.length>0)});
 document.querySelectorAll('.hist-edge').forEach(e=>{const on=cl.histEdges.has(e.dataset.edgeId);e.classList.toggle('route-active',on);e.classList.toggle('dim',!on&&rids.length>0)});
 document.querySelectorAll('.historical-label').forEach(label=>{const on=cl.histEdges.has(label.dataset.edgeId);label.classList.toggle('active',on);label.classList.toggle('dim',!on&&rids.length>0)});
 document.querySelectorAll('.hist-node,.modern-node').forEach(n=>{
  const id=n.dataset.id,on=cl.entities.has(id),primary=primaryEntities.has(id);
  n.classList.toggle('dim',rids.length>0&&!on&&!primary);n.classList.toggle('context',rids.length>0&&on&&!primary);
 });
 requestAnimationFrame(()=>resolveVisibleEdgeLabelCollisions());
 setTimeout(()=>resolveVisibleEdgeLabelCollisions(),220);
}

function currentFilterRoutes(rt){
 if(ACTIVE_MODE==='TECH'){
  if(!ACTIVE_FILTER||ACTIVE_FILTER==='ВСЕ')return[];
  if(ACTIVE_FILTER.startsWith('T'))return routeIdsFor(rt,ACTIVE_FILTER);
  const techIds=P0.technologies.filter(t=>t.menu_category===ACTIVE_FILTER).map(t=>t.entity_id);
  return [...new Set(techIds.flatMap(id=>routeIdsFor(rt,id)))];
 }
 if(ACTIVE_MODE==='COMPANY'){
  if(!ACTIVE_FILTER||ACTIVE_FILTER==='ВСЕ')return[];
  return rt.routesByCompany[ACTIVE_FILTER]||[];
 }
 return[];
}

function applyView(rt){
 resetClasses();
 if(SELECTED_ID){
  const rids=routeIdsFor(rt,SELECTED_ID);applyRoutes(rt,rids,new Set([SELECTED_ID]));
  document.querySelectorAll('.hist-node,.modern-node').forEach(n=>n.classList.toggle('selected',n.dataset.id===SELECTED_ID));
  return;
 }
 if(ACTIVE_MODE==='MAP')return;
 if(ACTIVE_MODE==='PEOPLE'){
  document.querySelectorAll('.modern-node,.modern-edge').forEach(x=>x.classList.add('dim'));
  if(!ACTIVE_FILTER||ACTIVE_FILTER==='ВСЕ')return;
  const primary=new Set(Object.entries(PERSON_PERIOD).filter(([,p])=>p===ACTIVE_FILTER).map(([id])=>id));
  const rids=[...new Set([...primary].flatMap(id=>routeIdsFor(rt,id)))];
  applyRoutes(rt,rids,primary);
  document.querySelectorAll('.hist-node').forEach(n=>{if(!primary.has(n.dataset.id)&&!n.classList.contains('context'))n.classList.add('dim')});
  return;
 }
 const rids=currentFilterRoutes(rt);
 if(rids.length){
  let primary=new Set();
  if(ACTIVE_MODE==='TECH'){
    if(ACTIVE_FILTER?.startsWith('T'))primary.add(ACTIVE_FILTER);
    else P0.technologies.filter(t=>t.menu_category===ACTIVE_FILTER).forEach(t=>primary.add(t.entity_id));
  } else if(ACTIVE_MODE==='COMPANY') primary.add(ACTIVE_FILTER);
  applyRoutes(rt,rids,primary);
 } else {
  if(ACTIVE_MODE==='TECH'){
    document.querySelectorAll('.hist-node,.hist-edge').forEach(x=>x.classList.add('dim'));
    document.querySelectorAll('.modern-node.company,.modern-node.external').forEach(x=>x.classList.add('context'));
  }
  if(ACTIVE_MODE==='COMPANY'){
    document.querySelectorAll('.hist-node,.hist-edge').forEach(x=>x.classList.add('dim'));
    document.querySelectorAll('.modern-node:not(.company)').forEach(x=>x.classList.add('context'));
  }
 }
}

function closeDrawer(){
 const d=document.getElementById('drawer'),stage=document.getElementById('stage');
 d.classList.remove('open','company-safe','pos-left','pos-right');
 stage.classList.remove('company-card-open');
}
function clearSelection(rt){
 SELECTED_ID=null;CARD_ENTITY_ID=null;CARD_TAB='OVERVIEW';CARD_ROUTE_FOCUS=null;closeDrawer();applyView(rt);
}

function positionDrawerForEntity(rt,id){
 const d=document.getElementById('drawer'),stage=document.getElementById('stage'),p=pos(id),e=rt.entityById[id];
 d.classList.remove('company-safe','pos-left','pos-right');
 stage.classList.remove('company-card-open');
 if(!p)return;
 if(e?.entity_type==='COMPANY'){
   d.classList.add('company-safe');
   stage.classList.add('company-card-open');
   return;
 }
 // Other cards remain floating opposite the selected side.
 if(p[0]>1120)d.classList.add('pos-left');
 else d.classList.add('pos-right');
}

function selectEntity(rt,id){
 SELECTED_ID=id;CARD_ENTITY_ID=id;CARD_TAB='OVERVIEW';CARD_ROUTE_FOCUS=null;applyView(rt);renderCard(rt);positionDrawerForEntity(rt,id);document.getElementById('drawer').classList.add('open');setTimeout(()=>resolveVisibleEdgeLabelCollisions(),240);
}

function buildSubnav(rt){
 const wrap=document.getElementById('subnavWrap'),sub=document.getElementById('subnav'),thirdWrap=document.getElementById('thirdnavWrap'),third=document.getElementById('thirdnav');
 sub.innerHTML='';third.innerHTML='';thirdWrap.classList.remove('open');
 if(ACTIVE_MODE==='MAP'){wrap.classList.remove('open');return}
 wrap.classList.add('open');
 let items=[];
 if(ACTIVE_MODE==='PEOPLE')items=PEOPLE_FILTERS.map(x=>({id:x,label:x}));
 if(ACTIVE_MODE==='TECH')items=TECH_CATEGORIES.map(x=>({id:x,label:x}));
 if(ACTIVE_MODE==='COMPANY')items=[{id:'ВСЕ',label:'ВСЕ'},...P0.companies.map(c=>({id:c.entity_id,label:c.title}))];
 sub.innerHTML=items.map(x=>`<button data-filter="${esc(x.id)}" class="${ACTIVE_FILTER===x.id?'active':''}">${esc(x.label)}</button>`).join('');
 sub.querySelectorAll('button').forEach(b=>b.onclick=()=>{
  SELECTED_ID=null;closeDrawer();
  ACTIVE_FILTER=b.dataset.filter;
  if(ACTIVE_MODE==='TECH')ACTIVE_TECH_CATEGORY=ACTIVE_FILTER==='ВСЕ'?null:ACTIVE_FILTER;
  buildSubnav(rt);applyView(rt);updateState();
 });
 if(ACTIVE_MODE==='TECH'&&ACTIVE_TECH_CATEGORY&&TECH_CATEGORIES.includes(ACTIVE_TECH_CATEGORY)&&ACTIVE_TECH_CATEGORY!=='ВСЕ'){
  const techs=P0.technologies.filter(t=>t.menu_category===ACTIVE_TECH_CATEGORY);
  thirdWrap.classList.add('open');
  third.innerHTML=techs.map(t=>`<button data-tech="${t.entity_id}" class="${ACTIVE_FILTER===t.entity_id?'active':''}">${esc(t.title)}</button>`).join('');
  third.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    SELECTED_ID=null;closeDrawer();
    ACTIVE_FILTER=b.dataset.tech;buildSubnav(rt);applyView(rt);updateState();
  });
 }
}

function setMode(rt,mode){
 ACTIVE_MODE=mode;SELECTED_ID=null;closeDrawer();
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
 ACTIVE_FILTER=mode==='MAP'?null:'ВСЕ';ACTIVE_TECH_CATEGORY=null;
 buildSubnav(rt);applyView(rt);updateState();
}
function updateState(){
 const label=ACTIVE_MODE==='MAP'?'КАРТА':ACTIVE_MODE==='PEOPLE'?'ЛЮДИ':ACTIVE_MODE==='TECH'?'ТЕХНОЛОГИИ':'КОМПАНИИ';
 const f=ACTIVE_FILTER||'ВСЁ';document.getElementById('viewState').textContent=`${label} · ${f}`;
}

async function boot(){
 const badge=document.getElementById('runtimeBadge'),err=document.getElementById('error');
 try{
  const frozen=JSON.parse(document.getElementById('historical-snapshot').textContent);
  const rawPeople=frozen.people,rawEdges=frozen.edges,rawContext=frozen.institutionalContext;
  const rawCards=frozen.personCards,rawTags=frozen.personTags;
  const rt=buildRuntime(patchHistorical(rawPeople,rawEdges,rawContext),patchPersonCards(rawCards),rawTags),result=qa(rt);window.RI_RUNTIME=rt;window.RI_QA=result;
  if(!result.pass)throw new Error('V17.7 QA FAIL\n'+JSON.stringify(result.checks,null,2));
  addHistorical(rt);addModern(rt);requestAnimationFrame(()=>requestAnimationFrame(()=>resolveVisibleEdgeLabelCollisions()));
  const allConnectionPaths=[...document.querySelectorAll('.hist-edge,.modern-edge')];
  if(!allConnectionPaths.every(path=>/\sC/.test(path.getAttribute('d')||'')))throw new Error('Non-Bezier connection detected');
  const companyYs=P0.companies.map(c=>MODERN_POS[c.entity_id][1]).sort((a,b)=>a-b),companyGaps=companyYs.slice(1).map((y,i)=>y-companyYs[i]);
  if(!companyGaps.every(g=>Math.abs(g-130)<.01))throw new Error('Company vertical distribution is not uniform');
  const renderedModern=document.querySelectorAll('.modern-edge').length,expected=P0.route_segments.filter(s=>s.relation_type!=='BASE_EDGE_REF').length;
  if(renderedModern!==expected)throw new Error(`Rendered modern edges ${renderedModern} != expected ${expected}`);
  badge.textContent=`81 / 74 / 6 · 8 / 7 / 14`;badge.classList.add('pass');
  document.getElementById('counts').textContent=`81 PEOPLE CARDS · 8 TECH CARDS · 7 COMPANY CARDS · 14 ROUTES`;
  document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setMode(rt,b.dataset.mode));
  document.querySelector('.drawer .close').onclick=()=>clearSelection(rt);
  document.getElementById('drawer').addEventListener('click',event=>{
   const tab=event.target.closest('[data-card-tab]');if(tab){CARD_TAB=tab.dataset.cardTab;renderCard(rt);return}
   const entity=event.target.closest('[data-entity-link]');if(entity){selectEntity(rt,entity.dataset.entityLink);return}
   const route=event.target.closest('[data-route-focus]');if(route){CARD_ROUTE_FOCUS=route.dataset.routeFocus;applyRoutes(rt,[CARD_ROUTE_FOCUS],new Set([CARD_ENTITY_ID]));renderCard(rt);return}
  });
  setupSearch(rt);
  document.getElementById('map').onclick=()=>clearSelection(rt);
  buildSubnav(rt);applyView(rt);updateState();
 }catch(e){console.error(e);badge.textContent='V17 FINAL · FAIL';badge.classList.add('fail');err.textContent=String(e.stack||e);err.classList.add('open')}
}
boot();
</script>
